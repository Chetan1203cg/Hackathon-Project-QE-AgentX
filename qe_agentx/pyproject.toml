[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "qe-agentx"
version = "0.1.0"
description = "QE AgentX — Agentic Test Design Assistant"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "orchestrator", "models", "integrations", "core", "api", "ui", "exports", "config"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, mocked unit tests",
    "integration: requires live services",
]

[tool.coverage.run]
source = ["agents", "orchestrator", "models", "core", "integrations"]
omit = ["tests/*", "*/__init__.py"]
